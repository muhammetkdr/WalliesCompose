name: AndroidDebugBuild
on:
  pull_request:
    branches: [ develop ]
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Inject Web Client ID into strings.xml
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          echo '<resources>' > app/src/main/res/values/strings.xml
          echo '<string name="web_client_id">${WEB_CLIENT_ID}</string>' >> app/src/main/res/values/strings.xml
          echo '</resources>' >> app/src/main/res/values/strings.xml

      - name: Create local.properties
        env:
          RELEASE_API_KEY: ${{ secrets.RELEASE_API_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          echo "RELEASE_API_KEY=${RELEASE_API_KEY}" > local.properties
          echo "WEB_CLIENT_ID=${WEB_CLIENT_ID}" >> local.properties
      

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: WalliesCompose-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7