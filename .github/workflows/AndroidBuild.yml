name: AndroidBuild
on:
  pull_request:
    branches: [ develop ]
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        env:
          RELEASE_API_KEY: ${{ secrets.RELEASE_API_KEY }}
        run: |
          echo "RELEASE_API_KEY=${RELEASE_API_KEY}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK with optimizations
        run: |
          ./gradlew assembleRelease \
          --no-daemon \
          --parallel \
          --max-workers=4 \
          --build-cache \
          --configuration-cache \
          --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: WalliesCompose-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7